name: Tune three expressive reaction clips

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - demo/run-reaction-tune.json

permissions:
  actions: read
  contents: read

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e ".[test]"
      - run: python -m src.validate_huddle --output .artifacts/huddle-preflight.json --require-ready
      - run: python -m pytest
      - uses: actions/download-artifact@v4
        with:
          name: huddle-audio
          path: .artifacts/base
          run-id: 33986818945
          github-token: ${{ github.token }}
      - run: python -m src.tune_huddle_reactions --base-audio-root .artifacts/base/huddle-audio --output .artifacts/huddle-audio
        env:
          ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_KEY }}
      - run: python -m src.compose_huddle_audio --audio-root .artifacts/huddle-audio --output .artifacts/composed
      - run: python -m src.validate_huddle_audio --audio-root .artifacts/huddle-audio --composed-root .artifacts/composed --output .artifacts/audio-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huddle-audio-tuned
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
