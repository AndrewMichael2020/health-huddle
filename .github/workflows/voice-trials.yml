name: Generate six standard-voice trials

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - demo/run-voice-trials.json

permissions:
  contents: read

jobs:
  trials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e ".[test]"
      - run: python -m src.validate_huddle --output .artifacts/huddle-preflight.json --require-ready
      - run: python -m src.generate_huddle_audio --mode trials --output .artifacts/voice-trials
        env:
          ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_KEY }}
      - run: python -m src.validate_huddle_audio --audio-root .artifacts/voice-trials --output .artifacts/voice-trial-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: voice-trials
          path: .artifacts/
          include-hidden-files: true
          retention-days: 7
