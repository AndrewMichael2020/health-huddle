[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "health-huddle"
version = "0.1.0"
description = "Synthetic LTC data-modernization and agent-huddle demonstration"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]
video = ["Pillow>=10,<12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
